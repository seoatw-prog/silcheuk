async function backupAll(onlyNeeded){
  const targets = sites.filter(s => !onlyNeeded || needsBackup(s));
  if(!targets.length){ toast(OFFLINE ? "보낼 현장이 없어요." : "백업할 현장이 없어요. 모두 백업돼 있어요."); return; }
  const btn = $("#backupBtn"); if(btn) btn.disabled = true;
  try{
    toast("사진 목록 불러오는 중…", 0);
    const snap = await db.collection("photos").get();
    const allPhotos = snap.docs.map(d => ({id:d.id, ...d.data()}));
    // 한 파일이 너무 커지면 휴대폰이 멈추므로, 약 100MB마다 파일을 나눠 저장한다
    const LIMIT = 100 * 1048576;
    const prefix = OFFLINE ? "실측보내기" : "실측백업";
    let zip = new JSZip(), inZip = [], bytes = 0, part = 1, missing = 0;
    const badNames = [], names = [];
    const flush = async () => {
      if(!inZip.length) return;
      const fn = `${prefix}_${today()}${part > 1 ? "_" + part : ""}.zip`; names.push(fn);
      await saveZip(zip, fn);
      await markBackedUp(inZip.filter(x => !x.missing).map(x => x.id));
      zip = new JSZip(); inZip = []; bytes = 0; part++;
    };
    for(let k = 0; k < targets.length; k++){
      const s = targets[k], list = allPhotos.filter(p => p.siteId === s.id);
      const folder = [safeName(s.date), safeName(s.name), safeName(s.address)].filter(Boolean).join("_") || ("현장" + (k+1));
      const r = await addSiteToZip(zip, s, list, folder, (i,n) => toast(`현장 ${k+1}/${targets.length} · 사진 ${i}/${n}`, 0));
      inZip.push({id: s.id, missing: r.missing}); bytes += r.bytes;
      if(r.missing){ missing += r.missing; badNames.push(s.name); }
      if(bytes >= LIMIT && k < targets.length - 1){ await flush(); toast(`파일 ${part - 1}개 저장했어요. 다음 파일을 만드는 중…`, 0); }
    }
    await flush();
    const files = part - 1;
    if(missing){ toast("", 1); await missingAlert(missing, badNames); }
    else if(OFFLINE){ toast("", 1); await sendGuide(names.join(", ")); }
    else toast((files > 1 ? `백업 파일 ${files}개로 나눠 저장했어요. ` : "백업했어요. ") + WHERE_SAVED, 5000);
  }catch(e){ toast(failMsg(e), 4000); }
  finally{ if(btn) btn.disabled = false; }
}

/* ---------- 직원이 보낸 파일 가져오기 (사장님 사진첩) ---------- */
async function importZip(file){
  if(!file || !assets) return;
  toast("파일 여는 중…", 0);
  let nSites = 0, nPhotos = 0, skipped = 0, failed = 0;
  try{
    const zip = await JSZip.loadAsync(file);
    const metas = zip.file(/(^|\/)_data\/[^/]+\/site\.json$/);
    if(!metas.length){
      toast("", 1);
      await dialog({title:"가져올 수 없는 파일이에요", text: esc("실측 앱의 '사장님께 보낼 파일'이나 사진첩 백업 파일(ZIP)인지 확인해 주세요."), ok:"알겠어요", cancel:null});
      return;
    }
    for(const mf of metas){
      const dir = mf.name.replace(/site\.json$/, "");
      const site = JSON.parse(await mf.async("string")).site;
      const pf = zip.file(dir + "photos.json");
      const plist = pf ? JSON.parse(await pf.async("string")).photos || [] : [];
      const ex = await db.doc("sites/" + site.id).get();
      const exSite = ex.exists ? ex.data() : null;
      const exPhotos = (await db.collection("photos").where("siteId", "==", site.id).get()).docs.map(d => ({id: d.id, ...d.data()}));
      for(let i = 0; i < plist.length; i++){
        const p = plist[i];
        toast(`${site.name || "현장"} 사진 가져오는 중 ${i+1}/${plist.length}`, 0);
        const cp = exPhotos.find(x => x.id === p.id);
        if(cp && (cp.updatedAt || 0) >= (p.updatedAt || 0)){ skipped++; continue; }
        const f = p._orig && zip.file(p._orig);
        if(!f){ failed++; continue; }
        const blob = new Blob([await f.async("arraybuffer")], {type:"image/jpeg"});
        const r = await assets.upload(blob, {type:"image/jpeg"});
        const {_orig, id, ...rest} = p;
        await db.doc("photos/" + p.id).set({...rest, siteId: site.id, assetId: r.id, annotatedId: null, thumbId: null, annotatedStale: (rest.ann || []).length > 0});
        if(cp) for(const old of [cp.assetId, cp.annotatedId, cp.thumbId].filter(Boolean)) assets.delete(old).catch(() => {});
        nPhotos++;
      }
      const {id, backedUpAt, galleryAt, ...sd} = site;
      const keepCloud = exSite && (exSite.updatedAt || 0) > (sd.updatedAt || 0);
      await db.doc("sites/" + site.id).set({...(keepCloud ? {...sd, ...exSite} : {...(exSite || {}), ...sd}), customSpaces: [...new Set([...(exSite && exSite.customSpaces || []), ...(sd.customSpaces || [])])], importedAt: Date.now(), updatedAt: Date.now()});
      nSites++;
    }
    toast("", 1);
    await dialog({title:"가져왔어요",
      text: esc(`현장 ${nSites}곳, 사진 ${nPhotos}장을 가져왔어요.` + (skipped ? ` 이미 있던 사진 ${skipped}장은 건너뛰었어요.` : "") + (failed ? ` 사진 ${failed}장은 파일에 없어서 가져오지 못했어요.` : "")),
      ok:"확인", cancel:null});
  }catch(e){
    toast("", 1);
    await dialog({title:"다 가져오지 못했어요",
      text: esc((nSites || nPhotos ? `현장 ${nSites}곳, 사진 ${nPhotos}장까지 가져왔어요. ` : "") + (e && e.code ? writeErr(e) : "파일을 열지 못했어요. 받은 ZIP 파일이 맞는지 확인해 주세요.") + " 같은 파일로 다시 가져오면 빠진 것만 이어서 가져와요."),
      ok:"확인", cancel:null});
  }
}

/* 휴대폰 키보드가 올라오면 보이는 화면 높이에 맞춰 입력 창을 올린다 (특히 아이폰) */
if(window.visualViewport){
  const vv = window.visualViewport, rs = document.documentElement.style;
  const fitVV = () => { rs.setProperty("--vv-h", vv.height + "px"); rs.setProperty("--vv-top", vv.offsetTop + "px"); };
  vv.addEventListener("resize", fitVV); vv.addEventListener("scroll", fitVV); fitVV();
}
boot();
})();
</script>
<script>
if("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
