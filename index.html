<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>현장 실측 사진첩</title>
<meta name="theme-color" content="#b8611a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>window.OFFLINE_APP = true;</script>
<script src="jszip.min.js"></script>
<script src="xlsx.full.min.js"></script>
<style>
/* layout: one-column field tool — 현장 목록 → 현장(사진·실측표) → 전체화면 사진 편집기
   look: 따뜻한 미색 바탕 + 크림빛 카드, 살구빛 갈색 강조, 테두리 대신 옅은 그림자, 넉넉한 여백과 둥근 모서리. 노란색은 줄자·치수 표시에만 */
:root{
  --ink:#3b3029;
  --paper:#f8f3ed;
  --card:#fffdfa;
  --line:#ece2d6;
  --muted:#8b7b6c;
  --accent:#b8611a;
  --accent-ink:#ffffff;
  --accent-soft:#fcefe2;
  --mark:#f2b632;
  --note:#fdf4e1;
  --danger:#c4503d;
  --danger-soft:#fbebe6;
  --ok:#3d8a5a;
  --ok-soft:#e8f3ea;
  --shadow:0 1px 2px rgba(110,70,30,.05),0 6px 20px rgba(110,70,30,.07);
  --shadow-up:0 -1px 0 rgba(110,70,30,.06),0 -8px 24px rgba(110,70,30,.07);
  --bar-bg:rgba(255,252,248,.88);
  --display:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:18px; --r-s:12px;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f2e9df; --paper:#1a1613; --card:#241f1a; --line:#3a3129; --muted:#b4a594;
    --accent:#f0a45f; --accent-ink:#2a170a; --accent-soft:#3a2a1d; --mark:#ffcc4d; --note:#33291b;
    --danger:#ff8a75; --danger-soft:#3b231e; --ok:#7cc796; --ok-soft:#1d3024;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28); --shadow-up:0 -8px 24px rgba(0,0,0,.3);
    --bar-bg:rgba(36,31,26,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#f2e9df; --paper:#1a1613; --card:#241f1a; --line:#3a3129; --muted:#b4a594;
    --accent:#f0a45f; --accent-ink:#2a170a; --accent-soft:#3a2a1d; --mark:#ffcc4d; --note:#33291b;
    --danger:#ff8a75; --danger-soft:#3b231e; --ok:#7cc796; --ok-soft:#1d3024;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28); --shadow-up:0 -8px 24px rgba(0,0,0,.3);
    --bar-bg:rgba(36,31,26,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:20px max(18px,env(safe-area-inset-right)) 130px max(18px,env(safe-area-inset-left));animation:fadeUp .35s var(--ease)}
.top{display:flex;align-items:center;gap:12px;padding-top:max(10px,env(safe-area-inset-top))}
.top h1{font-size:24px;font-weight:700;flex:1}
.sub{color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;border:0;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:16px;transition:transform .15s var(--ease),background-color .2s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.danger{color:var(--danger);background:var(--danger-soft)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{min-height:42px;padding:0 14px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.5}
.btn svg{width:22px;height:22px;flex:none}
.icon-btn{width:46px;height:46px;border-radius:14px;border:0;background:var(--card);color:var(--ink);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;flex:none;transition:transform .15s var(--ease)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:22px;height:22px}
.notice{background:var(--note);border:0;border-radius:var(--r);padding:14px 16px;font-size:15px}
.notice.err{background:var(--danger-soft)}
.search{width:100%;min-height:52px;border-radius:16px;border:1px solid transparent;background:var(--card);box-shadow:var(--shadow);padding:0 18px;transition:border-color .2s}
.search:focus{border-color:color-mix(in srgb,var(--accent) 45%,transparent);outline:0}
.list{display:grid;gap:12px}
.site{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;background:var(--card);border:0;border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);transition:transform .18s var(--ease),box-shadow .2s}
.site:active{transform:scale(.985)}
@media (hover:hover){.site:hover{box-shadow:0 2px 4px rgba(110,70,30,.06),0 10px 28px rgba(110,70,30,.1)}}
.site b{font-size:18px;font-family:var(--display)}
.site .sub{grid-column:1}
.site .date{grid-row:1/3;align-self:start;grid-column:2;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.stack{display:grid;gap:18px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;margin-top:4px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--mark) 26%,transparent);color:var(--ink)}
.backup{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--card);border:0;border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.backup.due{background:var(--note);box-shadow:none}
@media (max-width:420px){.backup{grid-template-columns:1fr}}
.steps{display:grid;gap:12px;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:0 16px;border-radius:999px;border:0;background:var(--card);box-shadow:0 1px 2px rgba(110,70,30,.06),0 2px 8px rgba(110,70,30,.05);font-weight:500;white-space:nowrap;transition:background-color .2s,color .2s,transform .15s var(--ease)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chip .n{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px;font-size:13px}
.label{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:color-mix(in srgb,var(--line) 70%,transparent);border:0;border-radius:16px;padding:4px}
.tabs button{min-height:44px;border:0;border-radius:12px;background:transparent;font-weight:700;color:var(--muted);transition:background-color .2s,color .2s}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(110,70,30,.1)}
.group h3{font-size:17px;display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.group h3 .sub{font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.thumb{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;border:0;background:var(--line);padding:0;box-shadow:var(--shadow);transition:transform .18s var(--ease)}
.thumb:active{transform:scale(.96)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .no{position:absolute;left:7px;top:7px;background:rgba(40,28,18,.6);backdrop-filter:blur(4px);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:1px 7px;font-variant-numeric:tabular-nums}
.thumb .pick{position:absolute;right:7px;top:7px;width:26px;height:26px;border-radius:50%;border:2.5px solid #fff;background:rgba(40,28,18,.35);box-shadow:0 1px 4px rgba(0,0,0,.3);display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700;line-height:1}
.thumb.on{box-shadow:0 0 0 3px var(--accent),var(--shadow)}
.thumb.on .pick{background:var(--accent);border-color:var(--accent)}
.thumb.on img{opacity:.82}
.sel-bar .in{grid-template-columns:auto 1fr}
.sel-bar .cnt{font-weight:700;align-self:center;padding:0 4px;white-space:nowrap}
.tool:disabled{opacity:.35}
.thumb .dims{position:absolute;right:7px;bottom:7px;background:var(--mark);color:#111;font-size:12px;font-weight:700;border-radius:8px;padding:1px 7px}
.empty{color:var(--muted);text-align:center;padding:32px 12px;border:1.5px dashed var(--line);border-radius:var(--r);background:color-mix(in srgb,var(--card) 50%,transparent)}
table.m{width:100%;border-collapse:collapse;background:var(--card);border:0;border-radius:var(--r);overflow:hidden;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
table.m th,table.m td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
table.m th{font-size:12px;color:var(--muted);background:transparent;letter-spacing:.03em}
table.m td.v{font-weight:700;font-size:17px;white-space:nowrap}
table.m tr:last-child td{border-bottom:0}
.memo{font-size:14px;color:var(--muted);margin-top:8px;white-space:pre-wrap}
.tabs .miss{display:inline-block;margin-left:5px;padding:0 7px;border-radius:999px;background:var(--mark);color:#111;font-size:12px;font-variant-numeric:tabular-nums}
.cl{display:grid;background:var(--card);border:0;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.cl-row{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;text-align:left;min-height:54px;padding:8px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;transition:background-color .15s}
.cl-row:active{background:var(--paper)}
.cl-row:last-child{border-bottom:0}
.cl-ic{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;line-height:1;transition:background-color .2s,border-color .2s}
.cl-row.done .cl-ic{background:var(--ok);border-color:var(--ok);color:var(--card)}
.cl-row.na .cl-ic{border-style:dashed;color:var(--muted)}
.cl-row.na .cl-n{color:var(--muted);text-decoration:line-through}
.cl-n{min-width:0}
.cl-v{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;max-width:46vw;overflow-wrap:anywhere}
.cl-row.todo .cl-v,.cl-row.na .cl-v{font-weight:400;color:var(--muted);font-size:14px}
.cl-row.todo .cl-v{color:var(--danger)}
.cl-v small{font-weight:400;color:var(--muted);font-size:12px}
.fin{background:var(--card);border:0;border-radius:var(--r);padding:16px 18px;display:grid;gap:12px;box-shadow:var(--shadow)}
.fin.ok{background:color-mix(in srgb,var(--ok-soft) 60%,var(--card))}
.fin-h{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center}
.fin-h b{font-size:17px}
.fin-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.fin.ok .fin-n{background:var(--ok);color:var(--card)}
.fin .pill{margin-top:0}
.fin .miss-list{display:grid;gap:4px;font-size:14px}
.fin .miss-list b{font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow-up);padding:12px max(18px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));z-index:5}
.bar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:10px}
.bar .btn{min-height:56px;font-size:17px;border-radius:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.claude{font-size:14px;color:var(--muted);background:transparent;border:1.5px dashed var(--line);border-radius:var(--r);padding:14px 16px}
.claude b{color:var(--ink)}
/* editor (사진 위에 그리는 화면은 사진이 잘 보이게 어두운 바탕 고정) */
#editor{position:fixed;inset:0;background:#16120f;color:#fff;z-index:20;display:flex;flex-direction:column;animation:fadeIn .2s var(--ease)}
#editor[hidden]{display:none}
.ed-top{display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left))}
.ed-top select{flex:1;min-width:0;min-height:44px;border-radius:12px;border:0;background:#2a231d;color:#fff;padding:0 12px;font-weight:700}
.ed-top .btn{min-height:44px;background:#2a231d;color:#fff;box-shadow:none}
.ed-top .btn.primary{background:var(--mark);color:#111}
#edStage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0;touch-action:none}
#cv{touch-action:none;display:block;border-radius:6px;transform-origin:0 0}
#loupe{position:absolute;top:10px;width:132px;height:132px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 18px rgba(0,0,0,.6);pointer-events:none;display:none;background:#000}
.ed-tools{display:flex;gap:6px;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));align-items:center}
.tools-scroll{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;align-items:center;scrollbar-width:none}
.tools-scroll::-webkit-scrollbar{display:none}
.tools-fixed{display:flex;gap:6px;flex:none;padding-left:8px;border-left:1px solid #3b3229}
.tool.icon{min-width:50px}
.cdot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #445}
.ed-bottom{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;padding:0 max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.ed-bottom .btn.primary{background:var(--mark);color:#111;min-height:50px;padding:0 26px;font-size:17px;box-shadow:none}
.ed-bottom textarea{width:100%;min-height:48px;max-height:90px;border-radius:12px;border:0;background:#2a231d;color:#fff;padding:12px 14px;resize:none}
.hint{font-size:13px;color:#bcaa98;padding:0 14px 4px;min-height:20px}
.tool{flex:none;min-width:58px;min-height:56px;border-radius:14px;border:0;background:#2a231d;color:#e3d6c8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;padding:4px 8px;transition:background-color .15s,color .15s,transform .15s var(--ease)}
.tool:active{transform:scale(.94)}
.tool svg{width:22px;height:22px}
.tool[aria-pressed="true"]{background:#fff;color:#111}
.swatch{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid #2a231d;box-shadow:0 0 0 1px #445}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px #fff}
.sep{width:1px;height:36px;background:#3b3229;flex:none;margin:0 4px}
/* 치수 입력 창 */
.dim-dlg{gap:14px}
.flabel{font-size:14px;font-weight:700;color:var(--muted)}
.flabel .sub{font-weight:400;font-size:12px}
.dim-dlg [data-g="label"]{flex-wrap:wrap;overflow:visible}
.dim-dlg .chip{background:var(--paper);box-shadow:none}
.dim-dlg .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip.small{min-height:38px;padding:0 13px;font-size:14px}
.field input.small-in{min-height:46px;font-size:15px}
.multi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.multi input{width:100%;font-variant-numeric:tabular-nums}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;text-align:left;padding:8px 0;font-size:14px;min-height:40px}
.err{color:var(--danger);font-size:14px;font-weight:700;margin:0}
/* dialog: 아래에서 부드럽게 올라오는 시트 */
.dlg-back{position:fixed;inset:0;background:rgba(45,30,18,.32);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s var(--ease)}
.dlg{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:12px max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));display:grid;gap:16px;max-height:92%;overflow:auto;box-shadow:0 -10px 40px rgba(45,30,18,.16);animation:sheetUp .3s var(--ease)}
.dlg::before{content:"";justify-self:center;width:40px;height:5px;border-radius:3px;background:var(--line)}
@media (min-width:600px){.dlg-back{align-items:center}.dlg{border-radius:24px;padding-top:20px}.dlg::before{display:none}}
.dlg h2{font-size:20px}
.field{display:grid;gap:6px}
.field label{font-size:14px;font-weight:700;color:var(--muted)}
.field input,.field textarea{min-height:52px;border-radius:14px;border:1.5px solid transparent;background:var(--paper);padding:0 16px;font-size:17px;transition:border-color .2s,background-color .2s}
.field input:focus,.field textarea:focus{outline:0;border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:var(--card)}
.field textarea{padding:12px 16px;min-height:90px;resize:vertical}
.field input.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;min-height:62px}
.dlg .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg .actions .wide{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:14px;font-weight:500;z-index:60;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:toastIn .25s var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* ---------- 휴대폰·태블릿 ---------- */
:root{padding-top:0!important;padding-bottom:0!important}   /* 바깥 틀의 안전 영역 여백이 화면 안 여백과 겹쳐 위아래가 두 번 비지 않게 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none}
button,.chip,.tool,.thumb,.cl-row,.site{touch-action:manipulation;-webkit-user-select:none;user-select:none}
#cv,.thumb img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.field input.small-in{font-size:16px}   /* 아이폰은 16px보다 작은 입력칸을 누르면 화면을 확대해 버린다 */
/* 키보드가 올라와도 입력 창이 가려지지 않게, 보이는 화면 높이에 맞춘다 (높이는 스크립트가 넣어 줌) */
.dlg-back{top:var(--vv-top,0px);bottom:auto;height:var(--vv-h,100%)}
.dlg{overscroll-behavior:contain}

/* ---------- toast & dialogs ---------- */
let toastTimer = null;
function toast(msg, ms = 2600){
  let t = $(".toast"); if(!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastTimer);
  if(ms) toastTimer = setTimeout(() => t.remove(), ms);
}
function dialog({title, fields = [], ok = "확인", cancel = "취소", danger = null, text = null}){
  return new Promise(resolve => {
    const back = document.createElement("div"); back.className = "dlg-back";
    const f = fields.map(fd => {
      const chips = fd.chips ? `<div class="chips">${fd.chips.map(c => `<button type="button" class="chip" data-for="${fd.id}" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>` : "";
      const input = fd.type === "textarea"
        ? `<textarea id="f_${fd.id}" placeholder="${esc(fd.placeholder||"")}">${esc(fd.value||"")}</textarea>`
        : `<input id="f_${fd.id}" type="${fd.type||"text"}" ${fd.inputmode?`inputmode="${fd.inputmode}"`:""} class="${fd.big?"big":""}" value="${esc(fd.value||"")}" placeholder="${esc(fd.placeholder||"")}" autocomplete="off">`;
      return `<div class="field"><label for="f_${fd.id}">${esc(fd.label)}</label>${input}${chips}</div>`;
    }).join("");
    back.innerHTML = `<form class="dlg" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h2>${esc(title)}</h2>${text?`<p style="margin:0">${text}</p>`:""}${f}
      <div class="actions">
        ${cancel?`<button type="button" class="btn" data-a="cancel">${esc(cancel)}</button>`:""}
        <button type="submit" class="btn primary ${cancel?"":"wide"}">${esc(ok)}</button>
        ${danger?`<button type="button" class="btn danger wide" data-a="danger">${esc(danger)}</button>`:""}
      </div></form>`;
    document.body.appendChild(back);
    const form = back.querySelector("form");
    const done = v => { back.remove(); resolve(v); };
    form.addEventListener("submit", e => { e.preventDefault();
      const out = {}; fields.forEach(fd => out[fd.id] = form.querySelector("#f_"+fd.id).value.trim());
      done(out); });
    back.addEventListener("click", e => {
      const a = e.target.closest("[data-a]"); if(a) return done(a.dataset.a === "danger" ? "danger" : null);
      const c = e.target.closest(".chip[data-for]"); if(c){ const inp = form.querySelector("#f_"+c.dataset.for); inp.value = c.dataset.v; inp.focus(); }
      if(e.target === back) done(null);
    });
    const first = form.querySelector("input,textarea"); if(first) setTimeout(() => { first.focus(); if(first.select) first.select(); }, 60);
  });
}

function waitForClaude(ms){
  return new Promise(res => {
    if(window.claude && window.claude.use) return res(window.claude);
    const t0 = Date.now();
    const iv = setInterval(() => {
      if(window.claude && window.claude.use){ clearInterval(iv); res(window.claude); }
      else if(Date.now() - t0 > ms){ clearInterval(iv); res(null); }
    }, 150);
  });
}

let idb = null, localDb = null, pendingLocal = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));

function idbReq(r){ return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
const idbStore = (name, m) => idb.transaction(name, m).objectStore(name);
async function idbWrite(name, fn){
  try{
    const t = idb.transaction(name, "readwrite"); fn(t.objectStore(name));
    await new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  }catch(e){ throw {code: e && e.name === "QuotaExceededError" ? "quota_exceeded" : "local_error", message: String(e && e.message || e)}; }
}
const localBlob = id => idbReq(idbStore("blobs", "readonly").get(id)).catch(() => null);
async function openLocal(loadBlobs){
  if(!window.indexedDB) return null;
  idb = await new Promise((res, rej) => {
    const r = indexedDB.open("silcheuk-sajincheop", 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("docs", {keyPath:"path"}); d.createObjectStore("blobs"); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error("blocked"));
  });
  const rows = await idbReq(idbStore("docs", "readonly").getAll());
  const cache = new Map(rows.map(r => [r.path, r.data]));
  if(loadBlobs){
    await new Promise((res, rej) => {
      const c = idbStore("blobs", "readonly").openCursor();
      c.onsuccess = () => { const k = c.result; if(!k) return res(); localUrls.set(k.key, URL.createObjectURL(k.value)); k.continue(); };
      c.onerror = () => rej(c.error);
    });
  }
  return makeLocalDb(cache);
}
function makeLocalDb(cache){
  const subs = new Set(), meta = {fromCache:false, hasPendingWrites:false};
  const colOf = p => p.slice(0, p.lastIndexOf("/")), idOf = p => p.slice(p.lastIndexOf("/") + 1);
  const snapDoc = p => ({id:idOf(p), exists:cache.has(p), data:() => cache.get(p), metadata:meta});
  const val = v => v == null ? -Infinity : v;
  const clone = d => JSON.parse(JSON.stringify(d));
  function run(q){
    let docs = [...cache.keys()].filter(p => colOf(p) === q.col).map(snapDoc);
    for(const [f, op, v] of q.wh) docs = docs.filter(d => { const x = d.data()[f]; return op === "==" ? x === v : op === "!=" ? x !== v : true; });
    if(q.ord){ const [f, dir] = q.ord, k = dir === "desc" ? -1 : 1; docs.sort((a, b) => { const x = val(a.data()[f]), y = val(b.data()[f]); return (x > y ? 1 : x < y ? -1 : 0) * k; }); }
    return {docs, size:docs.length, empty:!docs.length, metadata:meta, docChanges:() => []};
  }
  const notify = col => { for(const s of subs) if(s.q.col === col) setTimeout(() => s.next(run(s.q)), 0); };
  function docRef(p){
    return {id:idOf(p), path:p,
      get: async () => snapDoc(p),
      set: async data => { const d = clone(data); await idbWrite("docs", s => s.put({path:p, data:d})); cache.set(p, d); notify(colOf(p)); },
      update: async data => {
        if(!cache.has(p)) throw {code:"invalid_argument", message:"missing"};
        const d = {...cache.get(p), ...clone(data)};
        await idbWrite("docs", s => s.put({path:p, data:d})); cache.set(p, d); notify(colOf(p));
      },
      delete: async () => { await idbWrite("docs", s => s.delete(p)); cache.delete(p); notify(colOf(p)); },
      collection: c => query({col:p + "/" + c, wh:[], ord:null})
    };
  }
  function query(q){
    return {path:q.col,
      where: (f, op, v) => query({...q, wh:[...q.wh, [f, op, v]]}),
      orderBy: (f, dir = "asc") => query({...q, ord:[f, dir]}),
      limit: () => query(q),
      get: async () => run(q),
      onSnapshot: next => { const s = {q, next}; subs.add(s); setTimeout(() => next(run(q)), 0); return () => subs.delete(s); },
      doc: id => docRef(q.col + "/" + (id || newId())),
      add: async data => { const r = docRef(q.col + "/" + newId()); await r.set(data); return r; }
    };
  }
  return {doc:docRef, collection:c => query({col:c, wh:[], ord:null}), cache};
}
const localAssets = {
  async upload(blob){
    const id = "local_" + newId();
    await idbWrite("blobs", s => s.put(blob, id));
    const url = URL.createObjectURL(blob); localUrls.set(id, url);
    return {id, url, sizeBytes:blob.size, contentType:blob.type || "image/jpeg"};
  },
  async delete(id){
    await idbWrite("blobs", s => s.delete(id));
    const u = localUrls.get(id); if(u){ URL.revokeObjectURL(u); localUrls.delete(id); }
    return {deleted:true};
  },
  async list(){ return {assets:[], usage:{files:0, bytes:0, maxFiles:0, maxBytes:0}}; }
};
function countLocal(){
  if(!localDb) return null;
  const keys = [...localDb.cache.keys()];
  const s = keys.filter(p => /^sites\/[^/]+$/.test(p)).length, ph = keys.filter(p => /^photos\/[^/]+$/.test(p)).length;
  return s || ph ? {sites:s, photos:ph} : null;
}
/* 클라우드에 연결된 기기에서: 휴대폰 저장분을 같은 id로 옮기고 지운다 */
async function syncLocal(){
  const btn = $("#syncBtn"); if(btn) btn.disabled = true;
  try{
    const all = [...localDb.cache.entries()];
    const siteRows = all.filter(([p]) => /^sites\/[^/]+$/.test(p)), photoRows = all.filter(([p]) => /^photos\/[^/]+$/.test(p));
    for(const [p, d] of siteRows) await db.doc(p).set(d);
    for(let i = 0; i < photoRows.length; i++){
      const [p, d] = photoRows[i], nd = {...d};
      toast(`휴대폰 사진 올리는 중 ${i+1}/${photoRows.length}`, 0);
      for(const k of ["assetId", "annotatedId", "thumbId"]){
        const id = d[k]; if(!id || !String(id).startsWith("local_")) continue;
        const b = await localBlob(id);
        nd[k] = b ? (await assets.upload(b, {type:"image/jpeg"})).id : (k === "assetId" ? id : null);
      }
      await db.doc(p).set(nd);
      await localDb.doc(p).delete();
      for(const k of ["assetId", "annotatedId", "thumbId"]) if(d[k] && String(d[k]).startsWith("local_")) await idbWrite("blobs", s => s.delete(d[k])).catch(() => {});
    }
    for(const [p] of siteRows) await localDb.doc(p).delete();
    pendingLocal = null; toast("휴대폰에 있던 현장을 모두 올렸어요", 3500); renderHome();
  }catch(e){ toast(writeErr(e), 4000); if(btn) btn.disabled = false; }
}

async function boot(){
  setBoot("저장소에 연결하는 중이에요…");
  let wasLocal = false; try{ wasLocal = localStorage.getItem("sajincheop-mode") === "local"; }catch(_){}
  const C = OFFLINE ? null : await waitForClaude(wasLocal ? 3000 : 8000);
  if(C){
    try { db = await C.use("db"); } catch(e){ db = null; }
    if(!db && !wasLocal){ await sleep(1500); try { db = await C.use("db"); } catch(e){ db = null; } }
    let me = null; try { me = await C.use("user"); } catch(e){ me = null; }
    if(db && me){
      // 초대를 아직 못 받은 직원: 저장이 거절되니 휴대폰 저장 모드로 일하고, 초대받은 뒤 올린다
      let w = null; try { w = await me.can("data.write"); } catch(_){ w = null; }
      if(w === false){ db = null; waitInvite = true; }
    }
    if(db){ try { assets = await C.use("assets"); } catch(e){ assets = null; } }
    try { downloads = await C.use("downloads"); } catch(e){ downloads = null; }
    if(db && me){ try { canDelete = !!(await me.isOwner()); } catch(_){ canDelete = true; } }
  }
  if(db){
    mode = "cloud"; try{ localStorage.setItem("sajincheop-mode", "cloud"); }catch(_){}
    try{ localDb = await openLocal(false); }catch(_){ localDb = null; }
    pendingLocal = countLocal();
  } else {
    try{ localDb = await openLocal(true); }catch(_){ localDb = null; }
    if(!localDb){ fail("이 휴대폰에서는 사진을 저장할 수 없어요. 브라우저나 앱 설정에서 사이트 데이터 저장이 막혀 있는지 확인해 주세요.", true); return; }
    mode = "local"; db = localDb; assets = localAssets;
    if(OFFLINE) downloads = localDownloads;
    try{ localStorage.setItem("sajincheop-mode", "local"); }catch(_){}
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(_){}
    try{ if(navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(e => { storageUse = e.usage || 0; if(view === "home") renderHome(); }).catch(() => {}); }catch(_){}
  }
  const slow = setTimeout(() => { if(!loaded) setBoot("저장소 연결이 늦어지고 있어요. 인터넷 연결을 확인해 주세요. 연결되면 자동으로 열려요."); }, 10000);
  db.collection("sites").orderBy("updatedAt","desc").onSnapshot(snap => {
    sites = snap.docs.map(d => ({id: d.id, ...d.data()}));
    if(!snap.metadata.fromCache){ loaded = true; clearTimeout(slow); }
    if(cur){ const s = sites.find(x => x.id === cur.id); if(s) cur = s; }
    loaded = loaded || snap.size > 0;
    render();
  }, err => { clearTimeout(slow); fail("현장 목록을 불러오지 못했어요 ("+esc(err.code)+"). 페이지를 다시 열어 주세요."); });
}

function spacesOf(site){ return [...SPACES.filter(s => s !== "기타"), ...(site.customSpaces||[]), "기타"]; }
function ordered(){ return [...photos].sort((a,b) => (a.createdAt||0) - (b.createdAt||0)); }
/* 사진 번호는 찍을 때 한 번 정하고 바꾸지 않는다 (지워도 다른 사진 번호가 밀리지 않게) */
function numberOf(id){ const p = photos.find(x => x.id === id); return (p && p.no) || ordered().findIndex(x => x.id === id) + 1; }
const nextNo = () => Math.max(photos.length, ...photos.map(p => p.no || 0)) + 1;
let numbering = false;
async function migrateNumbers(siteId){
  if(numbering || !photos.some(p => !p.no)) return;
  numbering = true;
  try{
    let n = Math.max(0, ...photos.map(p => p.no || 0));
    for(const p of ordered()) if(!p.no && cur && cur.id === siteId){ n++; await db.doc("photos/" + p.id).update({no: n}); }
  }catch(_){}
  numbering = false;
}
/* 휴대폰 저장 모드: 사진첩에 아직 안 옮긴 사진 (찍거나 고친 뒤로 사진첩 저장을 안 한 것) */

function dimsOf(p){ return (p.ann||[]).filter(a => a.t === "dim"); }
/* 사진 없이 체크리스트에서 바로 적은 치수: 현장 문서의 direct에 {"공간|항목": {v, vs, ref, at}} 로 저장 */
const directOf = (site = cur) => (site && site.direct) || {};
function directRows(site = cur){
  return Object.entries(directOf(site)).map(([k, d]) => {
    const i = k.indexOf("|"), n = k.slice(i + 1);
    return {space: k.slice(0, i), n, key: k, a: {t:"dim", label: n, v: d.v, vs: d.vs || null, ref: d.ref || ""}};
  });
}
const directIn = (space, site = cur) => directRows(site).filter(r => r.space === space);
/* 이 공간에 사진이나 바로 적은 치수가 하나라도 있는지 (빠진 항목 계산 대상) */

        ${sp.map(n => `<button type="button" class="chip" data-space="${esc(n)}"${(s.customSpaces||[]).includes(n) ? ` data-custom="1"` : ""} aria-pressed="${n===nextSpace}">${esc(n)}${count(n)?`<span class="n">${count(n)}</span>`:""}</button>`).join("")}

      </div>

    </div>
    <button class="btn" id="finishBtn" type="button" style="min-height:52px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
      현장 마무리${finishDone() ? ` <span class="pill ok">완료 ${mdOf(cur.finishedAt)}</span>` : ""}
    </button>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" aria-selected="${tab==="photos"}" data-tab="photos">사진 ${all.length}장</button>
      <button type="button" role="tab" aria-selected="${tab==="check"}" data-tab="check">체크리스트${missingCount() ? `<span class="miss">${missingCount()}</span>` : ""}</button>
      <button type="button" role="tab" aria-selected="${tab==="table"}" data-tab="table">실측표</button>
    </div>
    <div id="tabBody" class="stack"></div>
    ${canDelete ? `<button class="btn danger" id="delSite" type="button" style="margin-top:12px">${OFFLINE && !needsBackup(s) ? "보낸 현장 이 휴대폰에서 지우기" : "이 현장 삭제"}</button>` : ""}
  </div>
  ${assets && pick ? `<div class="bar sel-bar"><div class="in">
    <button class="btn" id="pickCancel" type="button">취소</button>
    <button class="btn primary" id="pickMove" type="button" ${pick.size ? "" : "disabled"}>${pick.size ? pick.size + "장 공간 바꾸기" : "바꿀 사진을 눌러 고르세요"}</button>
  </div></div>` : assets ? `<div class="bar"><div class="in">
    <button class="btn primary" id="shoot" type="button">${ICON.cam} ${esc(nextSpace)} 사진 찍기</button>
    <button class="btn" id="album" type="button" aria-label="앨범에서 고르기">${ICON.album} 앨범</button>
  </div></div>`:""}`;
  $("#back").onclick = leaveSite;
  $("#editSite").onclick = editSite;
  $("#finishBtn").onclick = openFinish;
  const tg = $("#toGallery"); if(tg) tg.onclick = () => showGallery(true);
  app.querySelectorAll("[data-space]").forEach(b => b.onclick = () => { nextSpace = b.dataset.space; renderSite(); });
  // 직접 만든 공간: 길게 누르면(0.6초) 지우기 창
  app.querySelectorAll("[data-custom]").forEach(b => {
    let t = null, fired = false;
    b.addEventListener("pointerdown", () => { fired = false; clearTimeout(t); t = setTimeout(() => { fired = true; removeSpace(b.dataset.space); }, 600); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, () => clearTimeout(t)));
    b.addEventListener("contextmenu", e => e.preventDefault());
    b.addEventListener("click", e => { if(fired){ e.stopImmediatePropagation(); e.preventDefault(); fired = false; } }, true);
  });
  $("#addSpace").onclick = addSpace;
  const ds = $("#delSite"); if(ds) ds.onclick = deleteSite;
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; pick = null; renderSite(); });
  if(pick){ $("#pickCancel").onclick = () => { pick = null; renderSite(); }; $("#pickMove").onclick = movePicked; }
  else if(assets){ $("#shoot").onclick = () => $("#fileCam").click(); $("#album").onclick = () => $("#fileAlbum").click(); }
  const body = $("#tabBody");
  if(tab === "photos"){
    if(pick) pick = new Set([...pick].filter(id => all.some(p => p.id === id)));
    body.innerHTML = (assets && pick ? `<div class="notice" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:180px"><b>공간을 바꿀 사진을 눌러 고르세요</b><br><span class="sub">다 고르면 아래 <b>공간 바꾸기</b>를 눌러요.</span></span></div>`
      : assets ? `<button class="btn" id="addSketch" type="button">${ICON.line} 평면 스케치 추가 <span class="sub" style="font-weight:400">모눈종이에 평면을 그려요</span></button>` +
        (all.length > 1 ? `<button class="btn ghost small" id="pickStart" type="button" style="justify-self:start">여러 장 골라서 공간 바꾸기</button>` : "") : "") +
      (groups.length ? groups.map(g => `
      <section class="group"><h3>${esc(g.n)} <span class="sub">${g.items.length}장</span>${pick ? `<button type="button" class="linkbtn" data-pickall="${esc(g.n)}" style="margin-left:auto;padding:0;min-height:0">${g.items.every(p => pick.has(p.id)) ? "모두 빼기" : "모두 고르기"}</button>` : ""}</h3>
      <div class="grid">${g.items.map(p => `
        <button type="button" class="thumb${pick && pick.has(p.id) ? " on" : ""}" data-photo="${esc(p.id)}" aria-label="사진 ${numberOf(p.id)} ${pick ? "고르기" : "열기"}"${pick ? ` aria-pressed="${pick.has(p.id)}"` : ""}>
          <img loading="lazy" alt="" src="${esc(imgSrc(p.annotatedStale ? p.assetId : (p.thumbId || p.annotatedId || p.assetId)))}">
          <span class="no">${numberOf(p.id)}</span>${pick ? `<span class="pick">${pick.has(p.id) ? "✓" : ""}</span>` : ""}${dimsOf(p).length?`<span class="dims">치수 ${dimsOf(p).length}</span>`:""}
        </button>`).join("")}</div></section>`).join("")
      : `<p class="empty">아직 사진이 없어요.<br>아래 <b>사진 찍기</b>를 눌러 시작하세요.</p>`);
    body.querySelectorAll("[data-photo]").forEach(b => b.onclick = () => {
      if(pick){ const id = b.dataset.photo; pick.has(id) ? pick.delete(id) : pick.add(id); const y = window.scrollY; renderSite(); window.scrollTo(0, y); return; }
      const p = photos.find(x => x.id === b.dataset.photo); if(p) openEditor(p); });
    body.querySelectorAll("[data-pickall]").forEach(b => b.onclick = () => {
      const ids = all.filter(p => p.space === b.dataset.pickall).map(p => p.id), on = ids.every(id => pick.has(id));
      ids.forEach(id => on ? pick.delete(id) : pick.add(id)); const y = window.scrollY; renderSite(); window.scrollTo(0, y); });
    const ps = $("#pickStart"); if(ps) ps.onclick = () => { pick = new Set(); renderSite(); };
    const sk = $("#addSketch"); if(sk) sk.onclick = addSketch;
  } else if(tab === "check"){
    body.innerHTML = checklistHtml();
    bindChecklist(body);
  } else {
    body.innerHTML = tableHtml(groups) + `
      <div class="row">
        <button class="btn" id="copyTxt" type="button">글자로 복사</button>
        <button class="btn" id="gallery" type="button">사진 갤러리에 저장</button>
        ${downloads && window.XLSX ? `<button class="btn" id="xlsx" type="button">엑셀 파일 저장</button>` : `<button class="btn" id="tsv" type="button">엑셀에 붙여넣기 복사</button>`}
        ${downloads && window.JSZip ? `<button class="btn" id="zip" type="button">${W.one}</button>`:""}
      </div>
      <p class="sub" style="margin:0">치수 단위는 mm예요. 사진 위에 그은 치수선과 체크리스트에서 바로 적은 치수(<span class="direct-tag">직접</span>)가 자동으로 모여요.</p>`;
    $("#copyTxt").onclick = copyText;
    $("#gallery").onclick = () => showGallery(false);
    const xb = $("#xlsx"); if(xb) xb.onclick = saveXlsx;
    const tb = $("#tsv"); if(tb) tb.onclick = copyTsv;
    const z = $("#zip"); if(z) z.onclick = downloadZip;
    body.querySelectorAll("[data-photo]").forEach(b => b.onclick = () => { const p = photos.find(x => x.id === b.dataset.photo); if(p) openEditor(p); });
    body.querySelectorAll("[data-direct]").forEach(b => b.onclick = () => { const k = b.dataset.direct, i = k.indexOf("|"); directEdit(k.slice(0, i), k.slice(i + 1)); });
  }
  if(finishOv) renderFinish();
}

/* 고른 사진들의 공간을 한 번에 바꾼다 (사진 번호·치수·메모는 그대로) */
async function movePicked(){
  if(!pick || !pick.size) return;
  const list = photos.filter(p => pick.has(p.id)), sp = spacesOf(cur);
  const r = await new Promise(resolve => {
    const back = document.createElement("div"); back.className = "dlg-back";
    back.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-label="공간 바꾸기">
      <h2>사진 ${list.length}장을 어느 공간으로 옮길까요?</h2>
      <div class="chips" style="flex-wrap:wrap;overflow:visible">${sp.map(n => `<button type="button" class="chip" data-to="${esc(n)}" style="background:var(--paper);box-shadow:none">${esc(n)}</button>`).join("")}</div>
      <div class="actions"><button type="button" class="btn wide" data-a="cancel">취소</button></div></div>`;
    document.body.appendChild(back);
    const done = v => { back.remove(); resolve(v); };
    back.addEventListener("click", e => { const c = e.target.closest("[data-to]"); if(c) return done(c.dataset.to); if(e.target.closest("[data-a]") || e.target === back) done(null); });
  });
  if(!r) return;
  const todo = list.filter(p => p.space !== r);
  if(!todo.length){ toast(`이미 모두 ${r} 사진이에요`); return; }
  const btn = $("#pickMove"); if(btn) btn.disabled = true;
  let ok = 0;
  try{
    const t = Date.now();
    for(const p of todo){ await db.doc("photos/" + p.id).update({space: r, updatedAt: t}); p.space = r; p.updatedAt = t; ok++; }
    await touchSite();
    pick = null; nextSpace = sp.includes(r) ? r : nextSpace;
    toast(`사진 ${ok}장을 ${r}(으)로 옮겼어요`); renderSite();
  }catch(e){ toast((ok ? `${ok}장만 옮겼어요. ` : "") + writeErr(e), 4000); if(btn) btn.disabled = false; renderSite(); }
}

/* ---------- 현장 마무리: 빠진 항목 → 사진 지키기 → 실측표 보내기 → 마무리 기록 ---------- */
let finishOv = null, finishSent = {text:false, excel:false}, afterGallery = null;
const mdOf = t => { const d = new Date(t); return (d.getMonth()+1) + "/" + d.getDate(); };
const finishDone = () => !!(cur && cur.finishedAt && cur.finishedAt >= (cur.updatedAt || 0));
function finishPill(s){
  if(!s.finishedAt) return "";
  return (s.updatedAt || 0) > s.finishedAt ? `<span class="pill warn">마무리 후 수정됨</span>` : `<span class="pill ok">마무리 ${mdOf(s.finishedAt)}</span>`;
}
function openFinish(){
  finishSent = {text:false, excel:false};
  if(!finishOv){
    finishOv = document.createElement("div");
    finishOv.className = "ov"; finishOv.style.zIndex = "28";
    finishOv.setAttribute("role", "dialog"); finishOv.setAttribute("aria-label", "현장 마무리");
    document.body.appendChild(finishOv);
  }
  renderFinish();
}
function closeFinish(){
  if(finishOv){ finishOv.remove(); finishOv = null; }
  document.body.classList.remove("noscroll");
  if(view === "site" && cur) renderSite();
}
function renderFinish(){
  if(!finishOv || !cur) return;
  document.body.classList.add("noscroll");
  const spaces = checkSpaces().filter(spaceUsed);
  const missing = spaces.map(s => ({s, items: checkStatus(s).filter(x => x.state === "todo")})).filter(x => x.items.length);
  const mCount = missing.reduce((n, x) => n + x.items.length, 0);
  const unsaved = unsavedPhotos().length;
  const step = (n, title, ok, body) => `<section class="fin ${ok ? "ok" : ""}">
    <div class="fin-h"><span class="fin-n">${ok ? "✓" : n}</span><b>${title}</b><span class="pill ${ok ? "ok" : "warn"}">${ok ? "완료" : "할 일"}</span></div>${body}</section>`;

  const s1 = step(1, "빠진 항목 확인", mCount === 0, mCount
    ? `<div class="miss-list">${missing.map(x => `<span><b>${esc(x.s)}</b> ${esc(x.items.map(i => i.n).join(", "))}</span>`).join("")}</div>
       <p class="sub" style="margin:0">현장을 떠나면 다시 잴 수 없어요. 잴 필요가 없는 항목은 체크리스트에서 '해당 없음'으로 바꾸세요.</p>
       <button class="btn" type="button" data-f="check">체크리스트 열기 (빠짐 ${mCount})</button>`
    : `<p class="sub" style="margin:0">${spaces.length ? "잰 공간의 항목을 모두 쟀거나 '해당 없음'으로 표시했어요." : "아직 찍은 사진이나 적은 치수가 없어요."}</p>`)
    + (() => {
      const tilted = [...photos.flatMap(p => dimsOf(p).filter(a => spreadOf(a) >= SPREAD_WARN).map(a => `${esc(p.space)} ${esc(a.label || "치수")} (차 ${spreadOf(a)}mm)`)),
        ...directRows().filter(r => spreadOf(r.a) >= SPREAD_WARN).map(r => `${esc(r.space)} ${esc(r.n)} (차 ${spreadOf(r.a)}mm)`)];
      return tilted.length ? `<p class="notice" style="margin:0;font-size:14px"><b>기울어짐 주의</b> ${tilted.join(", ")}<br>붙박이 가구는 가장 작은 값으로 제작하고, 시공팀에 꼭 알려 주세요.</p>` : "";
    })();

  let s2;
  if(mode === "local" && !OFFLINE){
    s2 = step(2, "사진첩에 사진 저장", unsaved === 0, unsaved
      ? `<p class="sub" style="margin:0">사진 ${unsaved}장이 아직 이 툴 안에만 있어요. 앱 데이터가 지워지면 같이 없어져요.</p>
         <button class="btn primary" type="button" data-f="gallery">안 옮긴 사진 ${unsaved}장 저장하기</button>`
      : `<p class="sub" style="margin:0">모든 사진을 휴대폰 사진첩에 옮겼어요.</p>`);
  } else if(downloads && window.JSZip){
    const ok = !needsBackup(cur);
    s2 = step(2, W.step, ok, ok ? `<p class="sub" style="margin:0">${W.stepDone}</p>`
      : `<p class="sub" style="margin:0">${W.stepTodo}</p><button class="btn primary" type="button" data-f="zip">${W.one}</button>`);
  } else {
    s2 = step(2, "사진 보관", true, `<p class="sub" style="margin:0">사진은 클라우드 저장소에 보관돼 있어요.</p>`);
  }

  const sent = finishSent.text || finishSent.excel;
  const s3 = step(3, "실측표 보내기", sent, `
    <p class="sub" style="margin:0">복사한 뒤 카카오톡이나 카카오워크 대화방을 열어 붙여넣기 하세요. 사무실에서 상담자료를 만들 때 그대로 쓸 수 있어요.</p>
    <div class="row">
      <button class="btn ${finishSent.text ? "" : "primary"}" type="button" data-f="text">${finishSent.text ? "다시 복사" : "카톡용 글자 복사"}</button>
      ${downloads && window.XLSX ? `<button class="btn" type="button" data-f="xlsx">${finishSent.excel ? "엑셀 다시 저장" : "엑셀 파일 저장"}</button>`
        : `<button class="btn" type="button" data-f="tsv">${finishSent.excel ? "다시 복사" : "엑셀에 붙여넣기 복사"}</button>`}
    </div>`);

  const allOk = mCount === 0 && (mode !== "local" || unsaved === 0) && sent;
  finishOv.innerHTML = `
    <div class="top" style="padding-top:0"><h1 style="font-size:20px">현장 마무리</h1><button class="btn small" type="button" data-f="close">닫기</button></div>
    <p class="sub" style="margin:4px 0 12px">${esc(cur.name)} · ${esc(cur.address || "주소 없음")} · 사진 ${photos.length}장</p>
    <div class="stack">
      ${s1}${s2}${s3}
      <button class="btn ${allOk ? "primary" : ""}" type="button" data-f="done" style="min-height:56px">${allOk ? "마무리 완료" : "할 일이 남았지만 이대로 마무리"}</button>
      ${finishDone() ? `<p class="sub" style="margin:0;text-align:center">${mdOf(cur.finishedAt)}에 마무리했어요. 그 뒤로 바뀐 내용은 없어요.</p>` : ""}
    </div>`;

  finishOv.querySelectorAll("[data-f]").forEach(b => b.onclick = async () => {
    const f = b.dataset.f;
    if(f === "close") return closeFinish();
    if(f === "check"){ tab = "check"; return closeFinish(); }
    if(f === "gallery"){ afterGallery = renderFinish; return showGallery(true); }
    if(f === "zip"){ await downloadZip(); return renderFinish(); }
    if(f === "text"){ await copyText(); finishSent.text = true; return renderFinish(); }
    if(f === "tsv"){ await copyTsv(); finishSent.excel = true; return renderFinish(); }
    if(f === "xlsx"){ if(await saveXlsx()) finishSent.excel = true; return renderFinish(); }
    if(f === "done"){
      b.disabled = true;
      const now = Date.now();
      try{ await db.doc("sites/" + cur.id).update({finishedAt: now}); cur = {...cur, finishedAt: now}; toast("현장 마무리를 기록했어요", 3000); closeFinish(); }
      catch(e){ toast(writeErr(e)); b.disabled = false; }
    }
  });
}
/* ---------- 체크리스트: 치수선에 붙인 항목 이름으로 자동 체크, 나머지는 눌러서 확인/해당 없음 ---------- */
function checkStatus(space, site = cur, list = photos){
  const dims = list.filter(p => p.space === space).flatMap(p => dimsOf(p).map(a => ({a, p})));
  const marks = (site && site.checks) || {}, dir = directOf(site);
  const dval = (n, d) => ({a: {t:"dim", label: n, v: d.v, vs: d.vs || null, ref: d.ref || ""}, p: null});
  const base = itemsOf(space).map(it => {
    const key = space + "|" + it.n, m = marks[key];
    const vals = it.t === "dim" ? dims.filter(d => (d.a.label || "").trim() === it.n) : [];
    if(it.t === "dim" && dir[key]) vals.unshift(dval(it.n, dir[key]));
    const state = vals.length || m === "ok" ? "done" : m === "na" ? "na" : "todo";
    return {...it, key, state, vals};
  });
  // 목록에 없는 이름으로 바로 적은 치수도 체크리스트 끝에 보여 준다
  const names = new Set(base.map(x => x.n));
  const extra = Object.keys(dir).filter(k => k.startsWith(space + "|") && !names.has(k.slice(space.length + 1)))
    .map(k => { const n = k.slice(space.length + 1); return {n, t:"dim", key:k, state:"done", extra:true, vals:[dval(n, dir[k])]}; });
  return [...base, ...extra];
}
function checkSpaces(site = cur, list = photos, all = false){
  const sp = spacesOf(site), used = new Set([...list.map(p => p.space), ...Object.keys(site.checks || {}).map(k => k.split("|")[0]), ...Object.keys(site.direct || {}).map(k => k.split("|")[0])]);
  if(site === cur && view === "site") used.add(nextSpace);
  const extra = [...used].filter(x => !sp.includes(x));
  return (all ? [...sp, ...extra] : [...sp.filter(s => used.has(s)), ...extra]).filter(s => s !== SKETCH);
}
const missingCount = () => cur ? checkSpaces().filter(spaceUsed).reduce((n, s) => n + checkStatus(s).filter(x => x.state === "todo").length, 0) : 0;
function checklistHtml(){
  const list = checkSpaces(cur, photos, showAllSpaces);
  return `<div class="cl-cols">` + list.map(s => {
    const st = checkStatus(s), done = st.filter(x => x.state !== "todo").length;
    return `<section class="group"><h3>${esc(s)} <span class="sub">${done}/${st.length}</span></h3>
      <div class="cl">${st.map(it => { const ph = it.vals.find(d => d.p); return `<button type="button" class="cl-row ${it.state}" data-key="${esc(it.key)}" data-type="${it.t}" ${ph ? `data-photo-of="${esc(ph.p.id)}"` : ""}>
        <span class="cl-ic" aria-hidden="true">${it.state === "done" ? "✓" : it.state === "na" ? "–" : ""}</span>
        <span class="cl-n">${esc(it.n)}${it.t === "check" ? ` <span class="sub">확인</span>` : ""}</span>
        <span class="cl-v">${it.vals.length ? it.vals.map(d => esc(d.a.v) + (d.p ? "" : `<span class="direct-tag">직접</span>`) + (spreadOf(d.a) >= SPREAD_WARN ? ` <small style="color:var(--danger)">차${spreadOf(d.a)}</small>` : "") + (d.a.ref ? ` <small>${esc(d.a.ref)}</small>` : "")).join(", ")
          : it.state === "na" ? "해당 없음" : it.state === "done" ? "확인함" : it.t === "dim" ? `안 잼<span class="go">적기</span>` : "안 함"}</span>
      </button>`; }).join("")}</div>
      <button type="button" class="linkbtn" data-direct-space="${esc(s)}">+ ${esc(s)}에 다른 치수 바로 적기</button></section>`;
  }).join("") + `</div>

/* 체크리스트에서 숫자만 바로 적기. name이 없으면 항목도 고른다 */
async function directEdit(space, name){
  if(!cur) return;
  const key0 = name ? space + "|" + name : null, old = key0 ? directOf()[key0] : null;
  const isNa = !!(key0 && (cur.checks || {})[key0] === "na");
  const inList = !!(name && itemsOf(space).some(i => i.t === "dim" && i.n === name));
  const rem = checkStatus(space).filter(x => x.t === "dim" && x.state === "todo").map(x => x.n);
  const extra = [];
  if(assets) extra.push({a:"photo", label:`${ICON.cam} 사진 찍어서 재기`});
  if(inList && !old) extra.push({a:"na", label: isNa ? "해당 없음 풀기" : "잴 필요 없음 (해당 없음)"});
  const a = {label: name || "", v: old ? old.v : "", vs: old ? old.vs : null, ref: old ? old.ref : ""};
  const r = await dimDialog(a, !!old, {space, rem, fixed: !!name, needLabel: true,
    title: name ? `${space} · ${name}` : `${space} 치수 바로 적기`,
    sub: "사진 없이 숫자만 적어요. 실측표·엑셀·카톡 글에 같이 들어가요.",
    extra, onPhoto: () => { nextSpace = space; $("#fileCam").click(); }});
  if(r === null || r === "photo") return;
  const direct = {...directOf()}, checks = {...(cur.checks || {})};
  let msg = "";
  if(r === "danger"){ delete direct[key0]; msg = "지웠어요"; }
  else if(r === "na"){ if(isNa) delete checks[key0]; else checks[key0] = "na"; }
  else {
    const label = r.label.replace(/\|/g, "/"), key = space + "|" + label;
    direct[key] = {v: r.v, vs: r.vs, ref: r.ref, at: Date.now()};
    delete checks[key];
    msg = `${label} ${r.v} 저장했어요`;
  }
  cur = {...cur, direct, checks}; renderSite();
  try{ await db.doc("sites/" + cur.id).update({direct, checks, updatedAt: Date.now()}); if(msg) toast(msg); }catch(e){ toast(writeErr(e)); }
}

/* ---------- capture ---------- */
function shrink(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, 2000 / Math.max(w, h));
      w = Math.round(w*s); h = Math.round(h*s);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res({blob:b, w, h}) : rej(new Error("변환 실패")), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("이 사진 형식은 열 수 없어요")); };
    img.src = url;
  });
}

async function handleFiles(fileList, openAfter){

/* 평면 스케치: 모눈종이 한 장을 사진처럼 저장하고, 같은 편집기(직선·치수선·글자)로 그린다 */
async function addSketch(){
  if(!assets || !cur) return;
  toast("스케치 종이 만드는 중…", 0);
  try{
    const W = 1600, H = 1200, c = document.createElement("canvas"); c.width = W; c.height = H;
    const x = c.getContext("2d");
    x.fillStyle = "#ffffff"; x.fillRect(0, 0, W, H);
    const grid = (i, horiz) => {
      const major = i % 200 === 0;
      x.strokeStyle = major ? "#c9d1db" : "#e8ecf1"; x.lineWidth = major ? 2 : 1;
      x.beginPath();
      if(horiz){ x.moveTo(0, i + .5); x.lineTo(W, i + .5); } else { x.moveTo(i + .5, 0); x.lineTo(i + .5, H); }
      x.stroke();
    };
    for(let i = 0; i <= W; i += 40) grid(i, false);
    for(let i = 0; i <= H; i += 40) grid(i, true);
    const blob = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("변환 실패")), "image/jpeg", 0.9));
    const r = await assets.upload(blob, {type:"image/jpeg"});
    localUrls.set(r.id, URL.createObjectURL(blob));
    const ref = db.collection("photos").doc(), now = Date.now();
    const data = {siteId: cur.id, no: nextNo(), kind: "sketch", assetId: r.id, annotatedId: null, thumbId: null, space: SKETCH, memo: "", ann: [], w: W, h: H, createdAt: now, updatedAt: now};
    await ref.set(data); await touchSite();
    toast("스케치 종이를 만들었어요. 직선으로 벽을 긋고, 치수선으로 길이를 적으세요.", 3500);
    openEditor({id: ref.id, ...data});
  }catch(e){ toast(e && e.code ? writeErr(e) : "스케치 종이를 만들지 못했어요"); }
}

/* ---------- drawing ---------- */
function metrics(W, H){ const m = Math.min(W, H); return {lw: Math.max(2, m*0.005), fs: Math.max(16, m*0.042)}; }
function rr(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
/* 어두운 색(스케치용 먹색)은 흰 바탕 위에 쓰므로 테두리·글자 상자를 밝게 */
const isDarkColor = c => { const m = /^#([0-9a-f]{6})$/i.exec(c || ""); if(!m) return false; const n = parseInt(m[1], 16); return ((n >> 16) * 299 + ((n >> 8 & 255) * 587) + ((n & 255) * 114)) / 1000 < 110; };
const halo = c => isDarkColor(c) ? "rgba(255,255,255,.75)" : "rgba(0,0,0,.5)";
function drawLabel(ctx, x, y, txt, c, m){
  ctx.save(); ctx.font = `700 ${m.fs}px ${CANVAS_FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const w = ctx.measureText(txt).width, p = m.fs*0.35, h = m.fs*1.4;

    draw(); showLoupe(q); return;
  }
  if((ed.tool === "dim" || ed.tool === "line") && d.moved){
    p = snap(d.start, p); d.end = p;
    d.preview = {t:ed.tool, x1:d.start.x/ed.w, y1:d.start.y/ed.h, x2:p.x/ed.w, y2:p.y/ed.h, c:ed.color};
    draw(); showLoupe(p);
  } else if(ed.tool === "pen"){
    // 손가락이 3px 넘게 움직였을 때만 점을 남긴다 (선 모양은 같고, 저장 크기는 훨씬 작아짐)
    const lp = d.pts[d.pts.length - 1];
    if(Math.hypot(p.x - lp.x, p.y - lp.y) * cssPerImg() < 3) return;
    d.pts.push(p); d.preview = {t:"pen", c:ed.color, pts: d.pts.map(q => [q.x/ed.w, q.y/ed.h])}; draw(); showLoupe(p);
  }
});
async function endDrag(e){
  ptrs.delete(e.pointerId);
  if(pan && pan.id === e.pointerId){ pan = null; return; }
  if(pinch){ if(ptrs.size < 2) pinch = null; return; }
  const d = ed.drag; if(!d || d.id !== e.pointerId) return;
  ed.drag = null; hideLoupe();
  if(d.grab){
    const g = d.grab, a = ed.ann[g.i];
    const moved = a && (a.x1 !== g.orig.x1 || a.y1 !== g.orig.y1 || a.x2 !== g.orig.x2 || a.y2 !== g.orig.y2);
    const short = a && Math.hypot((a.x2-a.x1)*ed.w, (a.y2-a.y1)*ed.h)*cssPerImg() < 20;
    if(e.type === "pointercancel" || !moved || short){
      if(a) ed.ann[g.i] = g.orig;
      if(short && moved) toast("선이 너무 짧아져서 원래대로 두었어요");
      draw();
      // 끝점을 움직이지 않고 톡 누르기만 했으면 예전처럼 치수 고치기
      if(!moved && e.type !== "pointercancel" && ed.tool === "dim" && a.t === "dim") editAnn(g.i);
      return;
    }
    const prev = clone(ed.ann); prev[g.i] = g.orig; pushHist(prev); draw();
    if(a.t === "dim") toast("치수선 위치만 옮겼어요. 숫자를 바꾸려면 숫자를 눌러 주세요", 2200);
    return;
  }
  if(e.type === "pointercancel"){ draw(); return; }
  const p = toImg(e);
  const longEnough = d.moved && Math.hypot(d.end.x-d.start.x, d.end.y-d.start.y)*cssPerImg() > 20;
  if(ed.tool === "dim"){
    if(longEnough){
      const a = {t:"dim", x1:round4(d.start.x/ed.w), y1:round4(d.start.y/ed.h), x2:round4(d.end.x/ed.w), y2:round4(d.end.y/ed.h), c:ed.color, v:"", label:"", ref:"", vs:null};
      ed.ann.push(a); draw();
      const r = await dimDialog(a, false);
      ed.ann.pop();
      if(r){ pushHist(); ed.ann.push({...a, v:r.v, label:r.label, ref:r.ref, vs:r.vs}); }
      draw();
    } else { draw(); const i = hitBox(p); if(i >= 0) editAnn(i); }
  } else if(ed.tool === "line"){
    if(longEnough){ pushHist(); ed.ann.push({t:"line", x1:round4(d.start.x/ed.w), y1:round4(d.start.y/ed.h), x2:round4(d.end.x/ed.w), y2:round4(d.end.y/ed.h), c:ed.color}); }
    draw();
  } else if(ed.tool === "text"){
    const i = hitBox(p);
    if(i >= 0) return editAnn(i);
    const r = await dialog({title:"글자 넣기", fields:[{id:"text", label:"넣을 글자", placeholder:"예: 배관, 콘센트, 창틀 높이 주의"}], ok:"넣기"});
    if(r && r.text){ pushHist(); ed.ann.push({t:"text", x:round4(p.x/ed.w), y:round4(p.y/ed.h), text:r.text, c:ed.color}); }
    draw();
  } else if(ed.tool === "pen"){
    if(d.pts.length > 1){ pushHist(); ed.ann.push({t:"pen", c:ed.color, pts: d.pts.filter((q,j) => j % 1 === 0).map(q => [round4(q.x/ed.w), round4(q.y/ed.h)])}); }
    draw();
  } else if(ed.tool === "erase"){
    const i = hitAny(p);
    if(i >= 0){ pushHist(); ed.ann.splice(i, 1); draw(); } else toast("지울 선이나 글자를 정확히 눌러 주세요");
  }
}
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);

/* opt (체크리스트에서 바로 적을 때): space, rem(안 잰 항목), fixed(항목이 정해짐), needLabel, title, sub, extra:[{a,label}], onPhoto */
function dimDialog(a, editing, opt = {}){
  // 항목 칩: 이 공간에서 아직 안 잰 것부터. 고치는 중인 선의 항목도 남겨 둔다
  const space = opt.space || $("#edSpace").value, rem = opt.rem || remainingFor(space), all = itemsOf(space).filter(i => i.t === "dim").map(i => i.n);
  const chips = [...new Set([...(a.label ? [a.label] : []), ...rem, ...all])];
  // 순서: 항목 칩 → 기준 → 숫자 → 확인. 칩을 누르면 숫자 칸으로 넘어가 키패드가 열린다.
  // 여러 점 측정(같은 자리를 높이 바꿔 다시 잰 값)은 눌렀을 때만 펼치고, 가구는 가장 좁은 값에 맞추므로 최솟값을 기록
  const vs0 = a.vs && a.vs.length > 1 ? a.vs : null;
  return new Promise(resolve => {
    const back = document.createElement("div"); back.className = "dlg-back";
    back.innerHTML = `<form class="dlg dim-dlg" role="dialog" aria-modal="true" aria-label="치수 입력">
      <h2>${esc(opt.title || (editing ? "치수 고치기" : "치수 적기"))}</h2>${opt.sub ? `<p class="sub" style="margin:-8px 0 0">${esc(opt.sub)}</p>` : ""}
      ${opt.fixed ? `<input id="dLabel" type="hidden" value="${esc(a.label || "")}">` : `<div class="field"><span class="flabel">무엇을 쟀나요? <span class="sub">안 잰 항목이 앞, 잰 항목은 ✓</span></span>
        <div class="chips" data-g="label">${chips.map(c => `<button type="button" class="chip" data-v="${esc(c)}" aria-pressed="${c === a.label}">${esc(c)}${rem.includes(c) ? "" : ` <span class="n">✓</span>`}</button>`).join("")}</div>
        <input id="dLabel" class="small-in" value="${esc(a.label || "")}" placeholder="목록에 없으면 직접 입력" autocomplete="off" aria-label="항목 이름">
      </div>`}
      <div class="field"><span class="flabel">기준 <span class="sub">선택 · 다시 누르면 해제</span></span>
        <div class="chips" data-g="ref">${REF_CHIPS.map(c => `<button type="button" class="chip small" data-v="${esc(c)}" aria-pressed="${c === a.ref}">${esc(c)}</button>`).join("")}</div>
      </div>
      <div class="field"><label for="dV">치수 (mm)</label>
        <input id="dV" class="big" inputmode="numeric" enterkeyhint="done" autocomplete="off" value="${esc(vs0 ? vs0[0] : (a.v || ""))}" placeholder="예: 2450">
        <div class="multi" id="dMulti" style="${vs0 ? "" : "display:none"}">
          <input id="dV2" inputmode="numeric" autocomplete="off" value="${esc(vs0 && vs0[1] != null ? vs0[1] : "")}" placeholder="2번째 (다른 높이)" aria-label="2번째 잰 값">
          <input id="dV3" inputmode="numeric" autocomplete="off" value="${esc(vs0 && vs0[2] != null ? vs0[2] : "")}" placeholder="3번째" aria-label="3번째 잰 값">
        </div>
        <button type="button" class="linkbtn" id="dMultiBtn" style="${vs0 ? "display:none" : ""}">+ 같은 자리 여러 번 재기 (붙박이장·기울어진 벽)</button>
        <p class="err" id="dErr" hidden></p>
      </div>
      <div class="actions">
        <button type="button" class="btn" data-a="cancel">취소</button>
        <button type="submit" class="btn primary">${editing ? "저장" : "확인"}</button>
        ${(opt.extra || []).map(x => `<button type="button" class="btn wide" data-a="${esc(x.a)}">${x.label}</button>`).join("")}
        ${editing ? `<button type="button" class="btn danger wide" data-a="danger">이 치수 지우기</button>` : ""}
      </div></form>`;
    document.body.appendChild(back);
    const form = back.querySelector("form"), q = s => form.querySelector(s);
    let ref = a.ref || "";
    const done = v => { back.remove(); resolve(v); };
    const markLabel = () => form.querySelectorAll('[data-g="label"] .chip').forEach(x => x.setAttribute("aria-pressed", x.dataset.v === q("#dLabel").value.trim()));
    form.addEventListener("click", e => {
      const c = e.target.closest(".chip"); if(!c) return;
      if(c.parentElement.dataset.g === "label"){ q("#dLabel").value = c.dataset.v; markLabel(); q("#dV").focus(); }
      else { ref = ref === c.dataset.v ? "" : c.dataset.v; form.querySelectorAll('[data-g="ref"] .chip').forEach(x => x.setAttribute("aria-pressed", x.dataset.v === ref)); }
    });
    q("#dLabel").addEventListener("input", markLabel);
    q("#dMultiBtn").onclick = () => { q("#dMulti").style.display = ""; q("#dMultiBtn").style.display = "none"; q("#dV2").focus(); };
    back.addEventListener("click", e => {
      const b = e.target.closest("[data-a]");
      if(b){
        const act = b.dataset.a;
        // 사진 찍기는 누른 그 순간에 카메라를 열어야 휴대폰이 막지 않는다
        if(act === "photo" && opt.onPhoto) opt.onPhoto();

      }
      if(e.target === back) done(null);
    });
    form.addEventListener("submit", e => {
      e.preventDefault();
      if(opt.needLabel && !q("#dLabel").value.trim()){ const p = q("#dErr"); p.textContent = "무엇을 쟀는지 골라 주세요"; p.hidden = false; return; }
      const clean = s => String(s || "").replace(/[,\s]/g, "").replace(/mm$/i, "");
      const raw = [clean(q("#dV").value), clean(q("#dV2").value), clean(q("#dV3").value)];
      const err = m => { const p = q("#dErr"); p.textContent = m; p.hidden = false; q("#dV").focus(); };
      if(!raw[0]) return err("치수를 적어 주세요");
      if(raw.some(x => x && !/^\d+(\.\d+)?$/.test(x))) return err("치수는 숫자만 적어 주세요 (mm 단위, 예: 2450)");
      const nums = raw.filter(Boolean).map(Number);
      const out = {label: q("#dLabel").value.trim(), ref, v: String(Math.min(...nums)), vs: nums.length > 1 ? nums : null};
      const sp = spreadOf(out);
      if(sp >= SPREAD_WARN) toast(`차이 ${sp}mm · 기울어짐 주의. 가장 작은 값 ${out.v}으로 기록했어요.`, 4000);
      done(out);
    });
    // 항목이 이미 정해져 있으면 바로 숫자 키패드, 아니면 칩부터 보이게 키패드를 열지 않는다
    if(a.label) setTimeout(() => q("#dV").focus(), 60);
  });
}
async function editAnn(i){
  const a = ed.ann[i];
  if(a.t === "dim"){
    const r = await dimDialog(a, true); if(r === null) return;
    pushHist();
    if(r === "danger") ed.ann.splice(i, 1); else ed.ann[i] = {...a, v:r.v, label:r.label, ref:r.ref, vs:r.vs};
  } else if(a.t === "text"){
    const r = await dialog({title:"글자 고치기", fields:[{id:"text", label:"글자", value:a.text}], ok:"저장", danger:"이 글자 지우기"});
    if(r === null) return;
    pushHist();
    if(r === "danger" || !r.text) ed.ann.splice(i, 1); else ed.ann[i] = {...a, text:r.text};
  }
  draw();
}

/* 저장 공간 절약: 치수가 그려진 큰 사진은 따로 저장하지 않고(필요할 때 원본 위에 다시 그림),
   목록에 보여 줄 작은 미리보기(긴 변 480px)만 저장한다 */
function makeThumb(){
  return new Promise((res, rej) => {
    const k = Math.min(1, 480 / Math.max(ed.w, ed.h));
    const c = document.createElement("canvas"); c.width = Math.round(ed.w*k); c.height = Math.round(ed.h*k);
    const ctx = c.getContext("2d"); ctx.scale(k, k); ctx.drawImage(ed.img, 0, 0, ed.w, ed.h); renderAnn(ctx, ed.ann, ed.w, ed.h);
    try{ c.toBlob(b => b ? res(b) : rej(new Error("합성 실패")), "image/jpeg", 0.8); }catch(e){ rej(e); }
  });
}
function editorChanged(){
  const p = ed.photo;
  return ed.dirty || $("#edMemo").value.trim() !== (p.memo||"") || $("#edSpace").value !== p.space;
}
function closeEditor(){ $("#editor").hidden = true; document.body.classList.remove("noscroll"); hideLoupe(); ed.photo = null; ed.img = null; renderSite(); }

$("#edClose").onclick = () => {
  // 바뀐 내용은 이미 자동 저장되어 있으니 묻지 않고, 합성 사진만 마저 만든다
  if(editorChanged() || ed.photo.annotatedStale || autoT) return saveEditor();
  closeEditor();
};
async function saveEditor(){
  const btn = $("#edSave"); if(btn.disabled) return; btn.disabled = true;
  clearTimeout(autoT); autoT = null;
  while(autoBusy) await sleep(50);
  toast("저장하는 중…", 0);
  try{
    const p = ed.photo, space = $("#edSpace").value, memo = $("#edMemo").value.trim();
    const annChanged = JSON.stringify(ed.ann) !== JSON.stringify(p.ann || []);
    let thumbId = p.thumbId || null, thumbFailed = false;
    const old = [];
    if(annChanged || p.annotatedStale || p.annotatedId || (ed.ann.length && !thumbId)){
      const prev = [p.annotatedId, thumbId].filter(Boolean);   // 예전 방식의 큰 합성 사진·옛 미리보기는 정리
      if(ed.ann.length){
        // 인터넷이 약하면 미리보기만 못 만들고 넘어간다 (치수는 그대로 저장되고, 다음 '완료' 때 다시 만든다)
        try{
          const blob = await makeThumb(); const r = await assets.upload(blob, {type:"image/jpeg"});
          localUrls.set(r.id, URL.createObjectURL(blob)); thumbId = r.id; old.push(...prev);
        }catch(_){ thumbFailed = true; }
      } else { thumbId = null; old.push(...prev); }
    }
    const changedNow = annChanged || memo !== (p.memo || "") || space !== p.space;
    const upd = {space, memo, ann: ed.ann, annotatedId: thumbFailed ? (p.annotatedId || null) : null, thumbId, annotatedStale: thumbFailed};
    if(changedNow) upd.updatedAt = Date.now();
    await db.doc("photos/"+p.id).update(upd);
    if(changedNow) await touchSite();     // 안 바꾸고 '완료'만 눌렀을 때 '백업 필요'가 잘못 뜨지 않게
    if(assets) old.forEach(id => assets.delete(id).catch(()=>{}));
    nextSpace = space;
    toast(thumbFailed ? "저장했어요. 미리보기 사진은 인터넷이 잘 될 때 다시 만들어요." : "저장했어요", thumbFailed ? 3500 : 2600); closeEditor();
  }catch(e){
    // 저장이 안 돼도 편집 화면에 갇히지 않게: 다시 시도하거나 그냥 닫을 수 있다
    toast("", 1);
    const r = await dialog({title:"저장하지 못했어요",
      text: esc(writeErr(e) + " 그냥 닫으면 마지막으로 자동 저장된 내용까지만 남아요."),
      ok:"다시 시도", cancel:"그냥 닫기"});
    btn.disabled = false;
    if(r !== null) return saveEditor();
    closeEditor(); return;
  }
  btn.disabled = false;
}
$("#edSave").onclick = saveEditor;
$("#edDel").onclick = async () => {
  const p = ed.photo; if(!p) return;
  const m = await dialog({title:`사진 ${numberOf(p.id)}번`, text: esc(`${p.space}${p.memo ? " · " + p.memo : ""}`), ok:"닫기", cancel:null, danger: canDelete ? "이 사진 삭제" : null});
  if(m !== "danger") return;
  if(!await confirmBox("사진 삭제", `사진 ${numberOf(p.id)}번과 그 위의 치수를 지울까요? 되돌릴 수 없어요.`)) return;
  clearTimeout(autoT); autoT = null;
  while(autoBusy) await sleep(50);
  try{
    await db.doc("photos/"+p.id).delete();
    if(assets) for(const id of [p.assetId, p.annotatedId, p.thumbId].filter(Boolean)) assets.delete(id).catch(()=>{});
    await touchSite(); toast("삭제했어요"); closeEditor();
  }catch(e){ toast(writeErr(e)); }
};

/* ---------- export & backup ---------- */
const byTime = list => [...list].sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
function textSummary(site = cur, list = photos){
  const all = byTime(list), sp = spacesOf(site), num = p => p.no || all.indexOf(p) + 1;
  const names = [...sp, ...[...new Set(all.map(p => p.space))].filter(x => !sp.includes(x))];
  let out = `[실측] ${site.name}\n주소: ${site.address||"-"}\n실측일: ${site.date||"-"}${site.phone?"\n연락처: "+site.phone:""}${site.memo?"\n메모: "+site.memo:""}\n(치수 단위 mm)\n`;
  const dimVal = a => `${a.v}${a.vs && a.vs.length > 1 ? ` [${a.vs.join("/")}, 차 ${spreadOf(a)}${spreadOf(a) >= SPREAD_WARN ? " 주의" : ""}]` : ""}${a.ref ? ` (${a.ref})` : ""}`;
  [...names, ...[...new Set(directRows(site).map(r => r.space))].filter(x => !names.includes(x))].forEach(n => {
    const items = all.filter(p => p.space === n), dr = directIn(n, site); if(!items.length && !dr.length) return;
    out += `\n■ ${n}${items.length ? ` (사진 ${items.length}장)` : ""}\n`;
    dr.forEach(r => out += `- ${r.n}: ${dimVal(r.a)} (직접 입력)\n`);
    items.forEach(p => {
      dimsOf(p).forEach(a => out += `- ${a.label||"치수"}: ${a.v}${a.vs && a.vs.length > 1 ? ` [${a.vs.join("/")}, 차 ${spreadOf(a)}${spreadOf(a) >= SPREAD_WARN ? " 주의" : ""}]` : ""}${a.ref ? ` (${a.ref})` : ""} (사진 ${num(p)})\n`);
      if(p.memo) out += `- 메모(사진 ${num(p)}): ${p.memo}\n`;
    });
  });
  return out;
}
async function copyText(){
  const t = textSummary();
  try{ await navigator.clipboard.writeText(t); toast("복사했어요. 카톡이나 문자에 붙여넣기 하세요."); }
  catch(e){ await dialog({title:"아래 글을 길게 눌러 복사하세요", fields:[{id:"t", label:"실측 내용", type:"textarea", value:t}], ok:"닫기", cancel:null}); }
}
/* 실측표 엑셀: 공간 순서대로 한 줄에 치수 하나, 숫자로 쓸 수 있는 치수는 숫자 칸으로 */
const SHEET_HEAD = ["공간","항목","치수(mm)","기준","여러 점 측정","차이(mm)","사진번호","메모"];
function sheetRows(site = cur, list = photos){
  const all = byTime(list), sp = spacesOf(site), num = p => p.no || all.indexOf(p) + 1;
  const names = [...sp, ...[...new Set(all.map(p => p.space))].filter(x => !sp.includes(x))];
  const rows = [];
  names.forEach(n => all.filter(p => p.space === n).forEach(p => {
    dimsOf(p).forEach(a => {
      const raw = String(a.v ?? "").replace(/,/g, "").trim(), v = Number(raw);
      const multi = a.vs && a.vs.length > 1;
      rows.push([n, a.label || "치수", raw !== "" && isFinite(v) ? v : a.v, a.ref || "", multi ? a.vs.join(" / ") : "", multi ? spreadOf(a) : "", num(p), ""]);
    });
    if(p.memo) rows.push([n, "메모", "", "", "", "", num(p), p.memo]);
  }));
  // 사진 없이 바로 적은 치수: 같은 공간의 맨 앞에 넣고, 사진번호 칸에는 '직접'
  const dr = directRows(site);
  if(!dr.length) return rows;
  const order = [...names, ...[...new Set(dr.map(r => r.space))].filter(x => !names.includes(x))];
  const drows = dr.map(r => {
    const raw = String(r.a.v ?? "").replace(/,/g, "").trim(), v = Number(raw), multi = r.a.vs && r.a.vs.length > 1;
    return [r.space, r.n, raw !== "" && isFinite(v) ? v : r.a.v, r.a.ref || "", multi ? r.a.vs.join(" / ") : "", multi ? spreadOf(r.a) : "", "직접", ""];
  });
  return [...drows, ...rows].map((r, i) => [r, i]).sort((x, y) => order.indexOf(x[0][0]) - order.indexOf(y[0][0]) || x[1] - y[1]).map(x => x[0]);
}
function buildWorkbook(site, list){
  const head = [["실측표"], ["현장", site.name || ""], ["주소", site.address || ""], ["실측일", site.date || ""], ["연락처", site.phone || ""], ["현장 메모", site.memo || ""], ["단위", "mm"], [], SHEET_HEAD];
  const ws = XLSX.utils.aoa_to_sheet([...head, ...sheetRows(site, list)]);
  ws["!cols"] = [{wch:12}, {wch:20}, {wch:11}, {wch:12}, {wch:20}, {wch:9}, {wch:9}, {wch:40}];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "실측표");
  const label = {done:"완료", na:"해당 없음", todo:"빠짐"};
  const ck = [["공간","항목","종류","상태","치수(mm)"]];
  checkSpaces(site, list).forEach(s => checkStatus(s, site, list).forEach(it =>
    ck.push([s, it.n, it.t === "dim" ? "치수" : "확인", label[it.state], it.vals.map(d => d.a.v + (d.a.ref ? " " + d.a.ref : "")).join(", ")])));
  const ws2 = XLSX.utils.aoa_to_sheet(ck);
  ws2["!cols"] = [{wch:12}, {wch:24}, {wch:6}, {wch:10}, {wch:20}];
  XLSX.utils.book_append_sheet(wb, ws2, "체크리스트");
  return wb;
}

/* 사진을 길게 눌러 휴대폰 사진첩에 저장할 수 있게 한 장씩 보여 준다 */
/* 치수가 그려진 사진: 합성본이 최신이면 그대로, 아니면 원본 위에 다시 그린다 */
async function photoBlob(p){
  if(p.annotatedId && !p.annotatedStale) return getBlob(p.annotatedId);
  const orig = await getBlob(p.assetId);
  if(!(p.ann || []).length) return orig;
  const url = URL.createObjectURL(orig);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0); renderAnn(ctx, p.ann, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("load")), "image/jpeg", 0.88));
  }finally{ URL.revokeObjectURL(url); }
}
const blobToDataUrl = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });

function getBlob(id){
  if(String(id).startsWith("local_")) return localBlob(id).then(b => { if(!b) throw new Error("load"); return b; });
  return fetch("/_blob/"+id).then(r => { if(!r.ok) throw new Error("load"); return r.blob(); }).catch(() => new Promise((res, rej) => {
    const img = new Image(); img.onload = () => { const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext("2d").drawImage(img,0,0); c.toBlob(b => b ? res(b) : rej(new Error("load")), "image/jpeg", 0.9); };
    img.onerror = () => rej(new Error("load")); img.src = imgSrc(id);
  }));
}
const safeName = s => String(s||"").replace(/[\\/:*?"<>|\n\r]/g, "").trim();
function needsBackup(s){ return !s.backedUpAt || (s.updatedAt||0) > s.backedUpAt; }
function backupLabel(s){
  if(!s.backedUpAt) return `<span class="pill warn">${W.pillNeed}</span>`;
  const d = new Date(s.backedUpAt), md = (d.getMonth()+1)+"/"+d.getDate();
  return needsBackup(s) ? `<span class="pill warn">${W.pillNew}</span>` : `<span class="pill ok">${W.pillOk} ${md}</span>`;
}
/* 현장 하나의 사진 + 실측표를 zip에 넣는다.
   _data/<현장id>/ 에 현장·사진 정보(JSON)를 같이 넣어서, 이 파일을 사진첩의 '가져오기'로 그대로 되살릴 수 있게 한다 */
async function addSiteToZip(zip, site, list, folder, progress){
  const all = byTime(list), base = folder ? folder + "/" : "";
  const csvRows = [["공간","항목","치수(mm)","기준","사진번호","메모"]];
  const meta = [];
  let missing = 0, bytes = 0;
  const freePath = path => zip.file(path) ? path.replace(/\.jpg$/, "_" + Math.random().toString(36).slice(2, 6) + ".jpg") : path;
  for(let i = 0; i < all.length; i++){
    const p = all[i], n = String(p.no || i+1).padStart(2,"0");
    if(progress) progress(i+1, all.length);
    const hasAnn = (p.ann || []).length > 0;
    let shown = null, orig = null;
    try{ const b = await photoBlob(p); bytes += b.size; shown = freePath(`${base}사진/${n}_${safeName(p.space)}.jpg`); zip.file(shown, b); }catch(_){ missing++; }
    if(hasAnn){ try{ const b = await getBlob(p.assetId); bytes += b.size; orig = freePath(`${base}원본/${n}_${safeName(p.space)}_원본.jpg`); zip.file(orig, b); }catch(_){ missing++; } }
    else orig = shown;
    meta.push({...p, _orig: orig});
    dimsOf(p).forEach(a => csvRows.push([p.space, a.label||"치수", a.v, a.ref || "", p.no || i+1, ""]));
    if(p.memo) csvRows.push([p.space, "메모", "", "", p.no || i+1, p.memo]);
  }
  directRows(site).forEach(r => csvRows.push([r.space, r.n, r.a.v, r.a.ref || "", "직접", ""]));
  zip.file(base + "실측표.csv", "﻿" + csvRows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n"));
  zip.file(base + "실측표.txt", textSummary(site, list));
  if(window.XLSX) zip.file(base + "실측표.xlsx", XLSX.write(buildWorkbook(site, list), {bookType:"xlsx", type:"array"}));
  zip.file(`${base}_data/${site.id}/site.json`, JSON.stringify({v:1, site:{...site, id:site.id}}));
  zip.file(`${base}_data/${site.id}/photos.json`, JSON.stringify({v:1, photos:meta}));
  return {missing, bytes};
}

function backupDoneMsg(missing){

const WHERE_SAVED = /iPhone|iPad/i.test(navigator.userAgent) ? "'파일' 앱에 저장돼요."
  : /Android/i.test(navigator.userAgent) ? "휴대폰 '다운로드' 폴더에 저장돼요." : "컴퓨터 '다운로드' 폴더에 저장돼요.";
const failMsg = e => e && e.code === "declined" ? "취소했어요" : (OFFLINE ? "파일을 만들지 못했어요. 휴대폰 저장 공간을 확인하고 다시 해 주세요." : "백업하지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.");
async function downloadZip(){

  }catch(e){ toast(failMsg(e), 4000); }
